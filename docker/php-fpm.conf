[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
; Pemungutan suara serentak di lab: sediakan cukup proses.
pm = dynamic
pm.max_children = 30
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
